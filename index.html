<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自分年表 | パーソナルタイムライン & ポートフォリオ</title>
  <meta name="description" content="人生の出来事を年表として記録し、ポートフォリオとしてHTMLエクスポートできるアプリ。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">
    <!-- ヘッダー -->
    <header class="header">
      <div class="header-left">
        <span class="logo">📜</span>
        <h1 class="app-title">自分年表</h1>
      </div>
      <div class="header-right">
        <button class="theme-btn" id="theme-btn" title="テーマ切替">🌙</button>
      </div>
    </header>

    <!-- ナビゲーション -->
    <nav class="nav" id="nav">
      <button class="nav-btn active" data-page="timeline">📅 年表</button>
      <button class="nav-btn" data-page="portfolio">🎨 ポートフォリオ</button>
      <button class="nav-btn" data-page="profile">👤 プロフィール</button>
    </nav>

    <!-- メインコンテンツ -->
    <main class="main">

      <!-- 年表ページ -->
      <section class="page active" id="page-timeline">
        <!-- カテゴリフィルター -->
        <div class="category-tabs" id="category-tabs">
          <button class="cat-tab active" data-cat="all">すべて</button>
          <button class="cat-tab" data-cat="education">🎓 学業</button>
          <button class="cat-tab" data-cat="work">💼 仕事</button>
          <button class="cat-tab" data-cat="skill">💡 スキル</button>
          <button class="cat-tab" data-cat="portfolio">🎨 作品</button>
          <button class="cat-tab" data-cat="certification">📜 資格</button>
          <button class="cat-tab" data-cat="private">🌸 プライベート</button>
          <button class="cat-tab" data-cat="other">📌 その他</button>
        </div>
        <!-- 検索バー -->
        <div class="search-bar">
          <input type="text" class="search-input" id="search-input" placeholder="イベントを検索..." />
        </div>
        <!-- タイムライン -->
        <div class="timeline" id="timeline"></div>
        <!-- 空状態 -->
        <div class="empty-state hidden" id="empty-state">
          <span class="empty-icon">📜</span>
          <p class="empty-text">イベントがまだありません</p>
          <p class="empty-sub">下のボタンからあなたの歴史を記録しましょう！</p>
        </div>
        <!-- FAB -->
        <button class="fab" id="add-btn" title="イベント追加">＋</button>
      </section>

      <!-- ポートフォリオページ -->
      <section class="page" id="page-portfolio">
        <div class="portfolio-actions">
          <button class="export-btn" id="export-btn">📥 HTMLエクスポート</button>
        </div>
        <div class="portfolio-preview" id="portfolio-preview"></div>
      </section>

      <!-- プロフィールページ -->
      <section class="page" id="page-profile">
        <h2 class="section-title">👤 プロフィール設定</h2>
        <div class="profile-form">
          <div class="form-group">
            <label>名前</label>
            <input type="text" class="form-input" id="profile-name" placeholder="山田太郎" />
          </div>
          <div class="form-group">
            <label>肩書き (タップで選択、自由入力もOK)</label>
            <div class="tag-preset" id="profile-tag-preset">
              <button class="tag-chip" data-tag="学生">🎓 学生</button>
              <button class="tag-chip" data-tag="エンジニア">💻 エンジニア</button>
              <button class="tag-chip" data-tag="デザイナー">🎨 デザイナー</button>
              <button class="tag-chip" data-tag="クリエイター">✨ クリエイター</button>
              <button class="tag-chip" data-tag="会社員">💼 会社員</button>
              <button class="tag-chip" data-tag="フリーランス">🚀 フリーランス</button>
              <button class="tag-chip" data-tag="起業家">🏢 起業家</button>
              <button class="tag-chip" data-tag="研究者">🔬 研究者</button>
              <button class="tag-chip" data-tag="音楽家">🎵 音楽家</button>
              <button class="tag-chip" data-tag="写真家">📷 写真家</button>
              <button class="tag-chip" data-tag="ライター">✏️ ライター</button>
              <button class="tag-chip" data-tag="ゲーマー">🎮 ゲーマー</button>
            </div>
            <div class="tag-custom-row">
              <input type="text" class="form-input" id="profile-tag-input" placeholder="自由入力してEnter..." />
            </div>
            <div class="tag-selected" id="profile-tag-selected"></div>
          </div>
          <div class="form-group">
            <label>自己紹介</label>
            <textarea class="form-textarea" id="profile-bio" placeholder="自己紹介文を入力..."></textarea>
          </div>
          <div class="form-group">
            <label>Twitter / X</label>
            <input type="text" class="form-input" id="profile-twitter" placeholder="@username" />
          </div>
          <div class="form-group">
            <label>GitHub</label>
            <input type="text" class="form-input" id="profile-github" placeholder="username" />
          </div>
          <div class="form-group">
            <label>Webサイト</label>
            <input type="url" class="form-input" id="profile-website" placeholder="https://example.com" />
          </div>
          <button class="save-profile-btn" id="save-profile-btn">💾 保存</button>
        </div>
      </section>
    </main>

    <!-- 初回セットアップ画面 -->
    <div class="setup-overlay hidden" id="setup-overlay">
      <div class="setup-content">
        <div class="setup-hero">
          <span class="setup-emoji">📜✨</span>
          <h2 class="setup-title">自分年表へようこそ！</h2>
          <p class="setup-desc">まずは基本情報を教えてください。<br>あなたの年表を作成します。</p>
        </div>
        <div class="setup-form">
          <div class="form-group">
            <label>お名前</label>
            <input type="text" class="form-input" id="setup-name" placeholder="山田太郎" />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>生まれた年</label>
              <input type="number" class="form-input" id="setup-birth-year" placeholder="2000" min="1900" max="2100" />
            </div>
            <div class="form-group">
              <label>生まれた月</label>
              <select class="form-select" id="setup-birth-month">
                <option value="1">1月</option>
                <option value="2">2月</option>
                <option value="3">3月</option>
                <option value="4">4月</option>
                <option value="5">5月</option>
                <option value="6">6月</option>
                <option value="7">7月</option>
                <option value="8">8月</option>
                <option value="9">9月</option>
                <option value="10">10月</option>
                <option value="11">11月</option>
                <option value="12">12月</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>学校の履歴 (自動で年表に追加されます)</label>
            <div class="school-options">
              <div class="school-option-group">
                <span class="school-option-label">就学前</span>
                <div class="school-chips" id="setup-preschool">
                  <button class="school-chip" data-val="none">なし</button>
                  <button class="school-chip selected" data-val="kindergarten">🏠 幼稚園</button>
                  <button class="school-chip" data-val="nursery">🧒 保育園</button>
                  <button class="school-chip" data-val="kodomoen">🌈 こども園</button>
                </div>
              </div>
              <div class="school-option-group">
                <span class="school-option-label">学校 (複数選択OK)</span>
                <div class="school-chips school-chips-multi" id="setup-schools">
                  <button class="school-chip selected" data-val="elem">🏫 小学校</button>
                  <button class="school-chip selected" data-val="junior">🏫 中学校</button>
                  <button class="school-chip selected" data-val="high">🏫 高校</button>
                </div>
              </div>
              <div class="school-option-group">
                <span class="school-option-label">高校卒業後の進学先</span>
                <div class="school-chips" id="setup-higher-ed">
                  <button class="school-chip selected" data-val="none">なし</button>
                  <button class="school-chip" data-val="university">🎓 大学 (4年)</button>
                  <button class="school-chip" data-val="junior-college">🎓 短期大学 (2年)</button>
                  <button class="school-chip" data-val="vocational-2">🎓 専門学校 (2年)</button>
                  <button class="school-chip" data-val="vocational-3">🎓 専門学校 (3年)</button>
                  <button class="school-chip" data-val="vocational-4">🎓 専門学校 (4年)</button>
                </div>
              </div>
            </div>
          </div>
          <div class="form-group">
            <label>肩書き (複数選択OK、自由入力もOK)</label>
            <div class="tag-preset" id="setup-tag-preset">
              <button class="tag-chip" data-tag="学生">🎓 学生</button>
              <button class="tag-chip" data-tag="エンジニア">💻 エンジニア</button>
              <button class="tag-chip" data-tag="デザイナー">🎨 デザイナー</button>
              <button class="tag-chip" data-tag="クリエイター">✨ クリエイター</button>
              <button class="tag-chip" data-tag="会社員">💼 会社員</button>
              <button class="tag-chip" data-tag="フリーランス">🚀 フリーランス</button>
              <button class="tag-chip" data-tag="起業家">🏢 起業家</button>
              <button class="tag-chip" data-tag="研究者">🔬 研究者</button>
              <button class="tag-chip" data-tag="音楽家">🎵 音楽家</button>
              <button class="tag-chip" data-tag="写真家">📷 写真家</button>
              <button class="tag-chip" data-tag="ライター">✏️ ライター</button>
              <button class="tag-chip" data-tag="ゲーマー">🎮 ゲーマー</button>
            </div>
            <div class="tag-custom-row">
              <input type="text" class="form-input" id="setup-tag-input" placeholder="自由入力してEnter..." />
            </div>
            <div class="tag-selected" id="setup-tag-selected"></div>
          </div>
          <div class="form-group">
            <label>ひとこと自己紹介 (任意)</label>
            <textarea class="form-textarea" id="setup-bio" placeholder="好きなことや興味があること..."></textarea>
          </div>
          <button class="setup-start-btn" id="setup-start-btn">🚀 年表をはじめる</button>
        </div>
      </div>
    </div>

    <!-- イベント登録/編集モーダル -->
    <div class="modal-overlay hidden" id="edit-modal">
      <div class="modal edit-modal">
        <h2 id="edit-modal-title">📜 イベント追加</h2>
        <div class="form-row">
          <div class="form-group">
            <label>年</label>
            <input type="number" class="form-input" id="form-year" placeholder="2025" min="1900" max="2100" />
          </div>
          <div class="form-group">
            <label>月</label>
            <select class="form-select" id="form-month">
              <option value="0">指定なし</option>
              <option value="1">1月</option>
              <option value="2">2月</option>
              <option value="3">3月</option>
              <option value="4">4月</option>
              <option value="5">5月</option>
              <option value="6">6月</option>
              <option value="7">7月</option>
              <option value="8">8月</option>
              <option value="9">9月</option>
              <option value="10">10月</option>
              <option value="11">11月</option>
              <option value="12">12月</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>タイトル</label>
          <input type="text" class="form-input" id="form-title" placeholder="例: 大学入学" />
        </div>
        <div class="form-group">
          <label>カテゴリ</label>
          <select class="form-select" id="form-category">
            <option value="education">🎓 学業</option>
            <option value="work">💼 仕事</option>
            <option value="skill">💡 スキル</option>
            <option value="portfolio">🎨 作品</option>
            <option value="certification">📜 資格</option>
            <option value="private">🌸 プライベート</option>
            <option value="other">📌 その他</option>
          </select>
        </div>
        <div class="form-group">
          <label>説明</label>
          <textarea class="form-textarea" id="form-desc" placeholder="詳細を入力..."></textarea>
        </div>
        <div class="form-group">
          <label>リンクURL (任意)</label>
          <input type="url" class="form-input" id="form-link" placeholder="https://..." />
        </div>
        <div class="form-group">
          <label>画像URL (任意)</label>
          <input type="url" class="form-input" id="form-image" placeholder="https://...画像のURL" />
        </div>
        <div class="modal-actions">
          <button class="modal-btn cancel" id="edit-cancel-btn">キャンセル</button>
          <button class="modal-btn save" id="edit-save-btn">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
